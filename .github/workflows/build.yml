name: NPSReact Android CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Check Expo project configuration
        run: npx expo config --type public

      - name: Run Expo Doctor (diagnostic)
        run: npx expo-doctor
        continue-on-error: true

      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist/android

      - name: Generate clean Android native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug and release APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify APK outputs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          sha256sum "$DEBUG_APK" "$RELEASE_APK" > checksums.txt
          {
            echo "Repository: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo "Ref: ${{ github.ref }}"
            echo "Expo SDK: 52"
            echo "Node: $(node --version)"
            echo "Java: $(java -version 2>&1 | head -n 1)"
            echo "Artifacts: app-debug.apk, app-release.apk"
            echo "Signing: generated native project's default signing configuration"
          } > build-metadata.txt

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npsreact-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            checksums.txt
            build-metadata.txt
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish tagged Android release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: npsreact-android-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NPSReact ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Android APKs built automatically by GitHub Actions.

            The release APK uses the generated native project's default signing configuration and is intended for direct testing/installation. Configure a persistent upload keystore before using builds for Play Store distribution or seamless updates between releases.
          files: |
            release-assets/**/*.apk
            release-assets/checksums.txt
            release-assets/build-metadata.txt
          fail_on_unmatched_files: true
