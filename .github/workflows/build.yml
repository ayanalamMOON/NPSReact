name: NPSReact Android CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validate and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate dependency lockfile
        timeout-minutes: 5
        env:
          npm_config_fetch_retries: "2"
          npm_config_fetch_retry_mintimeout: "10000"
          npm_config_fetch_retry_maxtimeout: "30000"
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-retries=2

      - name: Install locked dependencies
        timeout-minutes: 10
        env:
          npm_config_fetch_retries: "2"
          npm_config_fetch_retry_mintimeout: "10000"
          npm_config_fetch_retry_maxtimeout: "30000"
        run: npm ci --no-audit --no-fund --fetch-retries=2

      - name: Verify Expo dependency compatibility
        timeout-minutes: 5
        run: npx expo install --check

      - name: Validate Expo project configuration
        run: npx expo config --type public

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist/android

      - name: Export web application
        run: npx expo export --platform web --output-dir dist/web

      - name: Generate clean Android native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure Gradle caching and diagnostics
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Build debug APK, release APK and AAB
        working-directory: android
        timeout-minutes: 35
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --info --console=plain \
            --max-workers=2 \
            assembleDebug assembleRelease bundleRelease 2>&1 | tee ../gradle-build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify outputs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          RELEASE_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"
          sha256sum "$DEBUG_APK" "$RELEASE_APK" "$RELEASE_AAB" > checksums.txt
          {
            echo "Repository: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo "Ref: ${{ github.ref }}"
            echo "Expo: $(node -p "require('./node_modules/expo/package.json').version")"
            echo "React Native: $(node -p "require('./node_modules/react-native/package.json').version")"
            echo "Node: $(node --version)"
            echo "Java: $(java -version 2>&1 | head -n 1)"
            echo "Gradle: $(cd android && ./gradlew --version | grep '^Gradle ' | head -n 1)"
            echo "Signing: generated native project's default signing configuration"
          } > build-metadata.txt

      - name: Upload Gradle diagnostics on failure
        if: failure() && hashFiles('gradle-build.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: npsreact-gradle-diagnostics-${{ github.run_id }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npsreact-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            checksums.txt
            build-metadata.txt
          if-no-files-found: error
          retention-days: 30

  sync-pull-request-lockfile:
    name: Commit generated npm lockfile
    needs: build-android
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generate reproducible npm lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when it changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile with Expo SDK 58"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  publish-github-release:
    name: Publish tagged Android release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: npsreact-android-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: NPSReact ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Android builds generated by GitHub Actions.

            The release APK and AAB use the generated native project's default signing configuration. They are suitable for direct testing, but are not Play Store-ready. Configure a persistent upload keystore and signing secrets before publishing through Google Play or expecting seamless updates between installed versions.
          files: |
            release-assets/**/*.apk
            release-assets/**/*.aab
            release-assets/checksums.txt
            release-assets/build-metadata.txt
          fail_on_unmatched_files: true
